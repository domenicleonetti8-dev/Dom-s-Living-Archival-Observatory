name: D.O.M. Hazard Observatory truth qualification

on:
  push:
    branches:
      - main
    paths:
      - 'hazards.html'
      - 'hazards.js'
      - 'dom-hazard-*.js'
      - 'dom-earthquake-*.js'
      - 'dom-wildfire-*.js'
      - 'dom-global-seismic-heartbeat.js'
      - 'dom-observatory-dashboard-shell.js'
      - 'dom-runtime-config.js'
      - 'ci/dom-hazard-*.js'
      - 'ci/dom-source-time-truth-test.js'
      - '.github/workflows/hazard-truth-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hazard-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hazard JavaScript syntax qualification
        run: |
          node --check hazards.js
          node --check dom-hazard-geophysical-adapter.js
          node --check dom-hazard-render-reconciler.js
          node --check dom-wildfire-symbol-layer.js
          node --check dom-earthquake-visual-restoration.js
          node --check dom-earthquake-tsunami-atmospheric-fusion.js
          node --check dom-global-seismic-heartbeat.js
          node --check dom-observatory-dashboard-shell.js
      - name: Hazard source and rendering truth invariants
        run: node ci/dom-hazard-truth-invariants-test.js
      - name: Hazard semantics execution
        run: node ci/dom-hazard-semantics-test.js
      - name: Source time and freshness truth qualification
        run: node ci/dom-source-time-truth-test.js
