name: One-shot broker truth hardening

on:
  push:
    branches:
      - isolated-earth-geospatial-sensor-fabric-v1
    paths:
      - .github/workflows/one-shot-broker-truth-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: isolated-earth-geospatial-sensor-fabric-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical broker time and uncertainty hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          broker = Path('broker/dom_observation_broker.py')
          text = broker.read_text()
          helper_anchor = '''def valid_lat_lon(lat, lon) -> bool:\n'''
          helpers = '''def nonnegative_float(value) -> Optional[float]:\n    if value is None or value == "":\n        return None\n    try:\n        n = float(value)\n    except (TypeError, ValueError):\n        return None\n    if not math.isfinite(n) or n < 0:\n        return None\n    return n\n\n\ndef probability01(value) -> Optional[float]:\n    if value is None or value == "":\n        return None\n    try:\n        n = float(value)\n    except (TypeError, ValueError):\n        return None\n    if not math.isfinite(n):\n        return None\n    if 0 <= n <= 1:\n        return n\n    if 1 < n <= 100:\n        return n / 100.0\n    return None\n\n\ndef clean_optional_text(value) -> Optional[str]:\n    if value is None:\n        return None\n    text = str(value).strip()\n    return text or None\n\n\n'''
          if helpers.strip() not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit('broker helper anchor mismatch')
              text = text.replace(helper_anchor, helpers + helper_anchor, 1)
          start = text.index('def record(*,')
          end = text.index('\n\ndef poll_usgs()', start)
          new_record = '''def record(*, source_id: str, lineage: str, agency: str, network: str, kind: str,\n           modality: str, observed_at: Optional[str] = None, lat=None, lon=None,\n           source: Optional[str], title: str, authoritative: bool = True, **extra):\n    loc_ok = valid_lat_lon(lat, lon)\n    observed = normalize_iso(observed_at)\n    published_raw = extra.pop("publishedAt", None)\n    if published_raw is None:\n        published_raw = extra.pop("published_at", None)\n    valid_raw = extra.pop("validAt", None)\n    if valid_raw is None:\n        valid_raw = extra.pop("valid_at", None)\n    expires_raw = extra.pop("expiresAt", None)\n    if expires_raw is None:\n        expires_raw = extra.pop("expires_at", None)\n    fetched_raw = extra.pop("fetchedAt", None)\n    if fetched_raw is None:\n        fetched_raw = extra.pop("fetched_at", None)\n    published = normalize_iso(published_raw)\n    valid = normalize_iso(valid_raw)\n    expires = normalize_iso(expires_raw)\n    received = iso_now()\n    fetched = normalize_iso(fetched_raw) or received\n    location_precision = clean_optional_text(extra.pop("locationPrecision", None)) or "unresolved"\n    temporal_kind = clean_optional_text(extra.pop("temporalKind", None))\n    horizontal_accuracy = nonnegative_float(extra.pop("horizontalAccuracyMeters", None))\n    uncertainty_radius = nonnegative_float(extra.pop("uncertaintyRadiusMeters", None))\n    confidence_level = probability01(extra.pop("confidenceLevel", None))\n    uncertainty_basis = clean_optional_text(extra.pop("uncertaintyBasis", None))\n    r = {\n        "schema": "dom.observation.v1",\n        "sourceId": str(source_id or "").strip(),\n        "lineageId": str(lineage or "").strip(),\n        "sourceAgency": str(agency or "").strip(),\n        "network": str(network or "").strip(),\n        "kind": str(kind or "observation").strip(),\n        "modality": str(modality or "").strip(),\n        "lat": float(lat) if loc_ok else None,\n        "lon": float(lon) if loc_ok else None,\n        "locationPrecision": location_precision,\n        "horizontalAccuracyMeters": horizontal_accuracy,\n        "uncertaintyRadiusMeters": uncertainty_radius,\n        "confidenceLevel": confidence_level,\n        "uncertaintyBasis": uncertainty_basis,\n        "observedAt": observed,\n        "publishedAt": published,\n        "validAt": valid,\n        "expiresAt": expires,\n        "fetchedAt": fetched,\n        "receivedAt": received,\n        "sourceUrl": source_url(source),\n        "authoritative": bool(authoritative),\n        "officialAlert": False,\n        "title": str(title or kind or "observation").strip(),\n    }\n    if temporal_kind:\n        r["temporalKind"] = temporal_kind\n    r.update(extra)\n    status = str(r.get("observationStatus") or "reported").strip().lower()\n    r["observationStatus"] = status if status in OBSERVATION_STATUSES else "reported"\n    for name in ("quality", "freshness", "corroboration", "persistence", "hazardCoupling", "anomaly"):\n        if name in r:\n            r[name] = clamp01(r.get(name))\n    if r.get("officialAlert") and not (r.get("authoritative") and r.get("sourceAgency") and r.get("sourceUrl")):\n        r["officialAlert"] = False\n    provenance_ok = all((r["sourceId"], r["lineageId"], r["sourceAgency"], r["sourceUrl"]))\n    source_time_ok = any((r.get("observedAt"), r.get("publishedAt"), r.get("validAt")))\n    if not provenance_ok or (not source_time_ok and not r.get("inventorySnapshot")):\n        return None\n    return r\n'''
          text = text[:start] + new_record + text[end:]
          old_key = '''        return f"{r.get('lineageId','')}|{r.get('sourceId','')}|{r.get('observedAt','')}"'''
          new_key = '''        source_time = r.get("observedAt") or r.get("publishedAt") or r.get("validAt") or ""\n        return f"{r.get('lineageId','')}|{r.get('sourceId','')}|{source_time}"'''
          if text.count(old_key) != 1:
              raise SystemExit('broker key anchor mismatch')
          text = text.replace(old_key, new_key, 1)
          broker.write_text(text)

          adapters = Path('broker/dom_adapters.py')
          a = adapters.read_text()
          a = a.replace('sent = _iso(p.get("sent") or p.get("effective") or p.get("onset"))\n        if not raw_id or not url or not sent:', 'sent = _iso(p.get("sent"))\n        valid = _iso(p.get("effective") or p.get("onset"))\n        if not raw_id or not url or not (sent or valid):', 1)
          a = a.replace('kind="Official Weather Alert", modality="official-warning", observed_at=sent,', 'kind="Official Weather Alert", modality="official-warning", observed_at=None,', 1)
          a = a.replace('officialAlert=True, observationStatus="observed" if certainty.lower() == "observed" else "reported",\n            expiresAt=', 'officialAlert=True, observationStatus="observed" if certainty.lower() == "observed" else "reported",\n            publishedAt=sent, validAt=valid, temporalKind="publication", expiresAt=', 1)
          a = a.replace('kind="Tsunami", modality="official-tsunami-product", observed_at=updated,', 'kind="Tsunami", modality="official-tsunami-product", observed_at=None,', 1)
          a = a.replace('officialAlert=official_alert, observationStatus=status, locationPrecision="unresolved",', 'officialAlert=official_alert, observationStatus=status, locationPrecision="unresolved",\n            publishedAt=updated, temporalKind="publication",', 1)
          a = a.replace('kind="Space Weather", modality="space-weather-alert", observed_at=issued, lat=None, lon=None, source=url,', 'kind="Space Weather", modality="space-weather-alert", observed_at=None, lat=None, lon=None, source=url,', 1)
          a = a.replace('title=first[:240], authoritative=True, observationStatus=status, severityText=', 'title=first[:240], authoritative=True, observationStatus=status, publishedAt=issued, temporalKind="publication", severityText=', 1)
          adapters.write_text(a)

          nhc = Path('broker/nhc_gis_adapter.py')
          n = nhc.read_text()
          n = n.replace('kind="Tropical Cyclone Forecast Geometry", modality="official-nhc-gis", observed_at=issued,', 'kind="Tropical Cyclone Forecast Geometry", modality="official-nhc-gis", observed_at=None,', 1)
          n = n.replace('locationPrecision="source-geometry", observationStatus="forecast", quality=1.0,', 'locationPrecision="source-geometry", observationStatus="forecast", publishedAt=issued, temporalKind="forecast", quality=1.0,', 1)
          nhc.write_text(n)

          sci = Path('broker/scientific_station_adapters.py')
          s = sci.read_text()
          # Inventory retrieval time is fetch/snapshot time, not an observation time.
          s = s.replace('observed_at=observed_at,\n            lat=lat,', 'observed_at=None,\n            lat=lat,', 1)
          s = s.replace('inventorySnapshot=True,\n            upstream=', 'inventorySnapshot=True, fetchedAt=observed_at, temporalKind="inventory",\n            upstream=', 1)
          s = s.replace('kind="Scientific Station", modality=modality, observed_at=observed_at,', 'kind="Scientific Station", modality=modality, observed_at=None,', 1)
          s = s.replace('stationId=str(sid), platformClass=platform_class, inventorySnapshot=True,', 'stationId=str(sid), platformClass=platform_class, inventorySnapshot=True, fetchedAt=observed_at, temporalKind="inventory",', 1)
          s = s.replace('kind="Scientific Station", modality="water-monitoring-station", observed_at=observed_at,', 'kind="Scientific Station", modality="water-monitoring-station", observed_at=None,', 1)
          s = s.replace('stationId=str(sid), platformClass="water-monitoring-site", inventorySnapshot=True,', 'stationId=str(sid), platformClass="water-monitoring-site", inventorySnapshot=True, fetchedAt=observed_at, temporalKind="inventory",', 1)
          sci.write_text(s)

          tests = Path('broker/test_dom_observation_broker.py')
          t = tests.read_text()
          anchor = '''    def test_registry_truth_separates_registered_from_active_adapters(self):\n'''
          new_tests = '''    def test_record_normalizes_uncertainty_without_inference(self):\n        r = dom.record(source_id="u", lineage="L", agency="A", network="N", kind="Observation",\n                       modality="sensor", observed_at="2026-09-10T00:00:00Z", lat=40, lon=-74,\n                       source="https://example.com/u", title="U", horizontalAccuracyMeters=-1,\n                       uncertaintyRadiusMeters="12.5", confidenceLevel=87, uncertaintyBasis=" source metadata ")\n        self.assertIsNone(r["horizontalAccuracyMeters"])\n        self.assertEqual(r["uncertaintyRadiusMeters"], 12.5)\n        self.assertEqual(r["confidenceLevel"], 0.87)\n        self.assertEqual(r["uncertaintyBasis"], "source metadata")\n        self.assertEqual(r["locationPrecision"], "unresolved")\n        bad = dom.record(source_id="u2", lineage="L", agency="A", network="N", kind="Observation",\n                         modality="sensor", observed_at="2026-09-10T00:00:00Z", source="https://example.com/u2",\n                         title="U2", uncertaintyRadiusMeters=float("inf"), confidenceLevel=150)\n        self.assertIsNone(bad["uncertaintyRadiusMeters"])\n        self.assertIsNone(bad["confidenceLevel"])\n\n    def test_record_accepts_canonical_publication_time_without_fake_observation(self):\n        r = dom.record(source_id="pub", lineage="L", agency="A", network="N", kind="Official Weather Alert",\n                       modality="warning", observed_at=None, source="https://example.com/pub", title="P",\n                       publishedAt="2026-09-10T12:00:00Z", validAt="2026-09-10T12:05:00Z",\n                       expiresAt="2026-09-10T18:00:00Z", fetchedAt="2026-09-10T12:01:00Z", temporalKind="publication")\n        self.assertIsNotNone(r)\n        self.assertIsNone(r["observedAt"])\n        self.assertEqual(r["publishedAt"], "2026-09-10T12:00:00Z")\n        self.assertEqual(r["validAt"], "2026-09-10T12:05:00Z")\n        self.assertEqual(r["expiresAt"], "2026-09-10T18:00:00Z")\n        self.assertEqual(r["fetchedAt"], "2026-09-10T12:01:00Z")\n        self.assertEqual(r["temporalKind"], "publication")\n        self.assertIn("2026-09-10T12:00:00Z", dom.Broker.key(r))\n        fetch_only = dom.record(source_id="fetch-only", lineage="L", agency="A", network="N", kind="Observation",\n                                modality="sensor", observed_at=None, source="https://example.com/fetch", title="F")\n        self.assertIsNone(fetch_only)\n\n    def test_inventory_snapshot_can_have_unknown_source_event_time(self):\n        r = dom.record(source_id="station", lineage="inventory", agency="A", network="N", kind="Scientific Station",\n                       modality="station", observed_at=None, lat=40, lon=-74, source="https://example.com/stations",\n                       title="Station", inventorySnapshot=True, fetchedAt="2026-09-10T12:00:00Z", temporalKind="inventory",\n                       locationPrecision="source-coordinate")\n        self.assertIsNotNone(r)\n        self.assertIsNone(r["observedAt"])\n        self.assertIsNone(r["publishedAt"])\n        self.assertIsNone(r["validAt"])\n        self.assertEqual(r["fetchedAt"], "2026-09-10T12:00:00Z")\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('broker test anchor mismatch')
          t = t.replace(anchor, new_tests + anchor, 1)
          t = t.replace('"properties": {"event": "Test Warning", "sent": "2026-09-10T00:00:00Z", "expires": "2026-09-10T06:00:00Z",', '"properties": {"event": "Test Warning", "sent": "2026-09-10T00:00:00Z", "effective": "2026-09-10T00:05:00Z", "expires": "2026-09-10T06:00:00Z",', 1)
          t = t.replace('self.assertTrue(r["officialAlert"])\n        self.assertEqual(r["observationStatus"], "observed")', 'self.assertTrue(r["officialAlert"])\n        self.assertIsNone(r["observedAt"])\n        self.assertEqual(r["publishedAt"], "2026-09-10T00:00:00Z")\n        self.assertEqual(r["validAt"], "2026-09-10T00:05:00Z")\n        self.assertEqual(r["observationStatus"], "observed")', 1)
          t = t.replace('self.assertEqual(r["observationStatus"], "observed")\n        self.assertTrue(r["authoritative"])', 'self.assertEqual(r["observationStatus"], "observed")\n        self.assertIsNone(r["observedAt"])\n        self.assertEqual(r["publishedAt"], "2026-09-10T12:00:00Z")\n        self.assertTrue(r["authoritative"])', 1)
          tests.write_text(t)
          PY
      - name: Broker regression tests
        run: |
          cd broker
          python -m unittest discover -p 'test_*.py'
      - name: Compile broker
        run: python -m py_compile broker/*.py
      - name: Commit hardened broker and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'domenicleonetti8-dev'
          git config user.email 'domenicleonetti8@gmail.com'
          git rm .github/workflows/one-shot-broker-truth-hardening.yml
          git add broker/dom_observation_broker.py broker/dom_adapters.py broker/nhc_gis_adapter.py broker/scientific_station_adapters.py broker/test_dom_observation_broker.py
          git commit -m 'Canonicalize broker source time and uncertainty semantics'
          git push origin HEAD:isolated-earth-geospatial-sensor-fabric-v1
