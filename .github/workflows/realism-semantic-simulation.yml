name: Realism Semantic Simulation
on:
  push:
    branches: [hazard-realism-safe-build-20260915]
    paths:
      - 'dom-realism-runtime.js'
      - 'dom-realism-observatory-adapter.js'
      - 'tests/realism-semantic-simulation.js'
      - 'tests/walkable-realism-simulation.js'
      - '.github/workflows/realism-semantic-simulation.yml'
  workflow_dispatch:
jobs:
  semantic-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check realism runtime
        run: node --check dom-realism-runtime.js
      - name: Syntax check Observatory adapter
        run: node --check dom-realism-observatory-adapter.js
      - name: Syntax check semantic simulation
        run: node --check tests/realism-semantic-simulation.js
      - name: Syntax check walkable simulation
        run: node --check tests/walkable-realism-simulation.js
      - name: Run semantic simulation
        run: node tests/realism-semantic-simulation.js
      - name: Run walkable physical simulation
        run: node tests/walkable-realism-simulation.js
