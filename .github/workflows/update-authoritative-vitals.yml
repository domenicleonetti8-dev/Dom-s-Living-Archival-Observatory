name: Update authoritative Earth vitals

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: authoritative-vitals-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authoritative vitals
        run: |
          python tools/update_authoritative_vitals.py
          python tools/update_2026_current_sources.py
      - name: Validate authoritative snapshot and statistics
        run: |
          python - <<'PY'
          import json, math
          p=json.load(open('data/live-vitals.json'))
          assert p['schema']=='dom-authoritative-vitals-2026-v2'
          assert p.get('verifiedAsOf')=='2026-09-12'
          for key in ('population','temperature','seaLevel','cryosphere','coralBleaching'):
              assert p[key]['status'] in ('live','failed')
          for key in ('population','temperature','seaLevel'):
              assert p[key].get('sourceUrl','').startswith('https://')
          if p['temperature']['status']=='live':
              assert p['temperature']['baseline']=='1951-1980'
              assert -5 <= float(p['temperature']['anomalyC']) <= 5
          if p['seaLevel']['status']=='live':
              s=p['seaLevel']
              assert 0 <= float(s['trendMmPerYear']) <= 20
              assert int(s['sampleCount']) >= 24
              assert float(s['endDecimalYear']) >= float(s['startDecimalYear'])
              assert -1 <= float(s['r2']) <= 1
              assert 'autocorrelated' in s.get('statisticalCaveat','')
          c=p['cryosphere']
          if c['status']=='live':
              assert any(x.get('status')=='live' for x in c['seaIce'].values())
              for x in c['seaIce'].values():
                  assert x.get('sourceUrl','').startswith('https://')
                  if x.get('status')!='live':
                      continue
                  assert 0 < float(x['extentMillionKm2']) <= 30
                  n=int(x.get('climatologySampleCount') or 0)
                  if n >= 20:
                      mean=float(x['climatologyMeanMillionKm2'])
                      anom=float(x['anomalyMillionKm2'])
                      pct=float(x['anomalyPercent'])
                      assert mean > 0
                      assert math.isclose(pct, anom/mean*100, rel_tol=1e-10, abs_tol=1e-10)
                      assert x.get('climatologyPeriod')=='1981-2010'
          cb=p['coralBleaching']
          assert cb.get('sourceUrl','').startswith('https://')
          if cb['status']=='live':
              assert cb.get('productVersion')=='3.1'
              assert cb.get('productReleased')=='2026-04-30'
              assert 0 <= float(cb['globalReefPixelsExposedPct']) <= 100
              assert int(cb['windowDays']) == 365
              assert cb.get('observationDate')
          latest=p.get('latestAssessments') or {}
          assert latest.get('forests',{}).get('latestAvailableAsOf2026') is True
          assert latest.get('coralCover',{}).get('latestAvailableAsOf2026') is True
          print('AUTHORITATIVE_VITALS_2026_STATISTICS=PASS')
          PY
      - name: Commit changed snapshot only
        shell: bash
        run: |
          if git diff --quiet -- data/live-vitals.json; then
            echo 'No vitals snapshot change.'
            exit 0
          fi
          git config user.name 'dom-vitals-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live-vitals.json
          git commit -m 'Refresh authoritative Earth vitals snapshot'
          git push origin "HEAD:${GITHUB_REF_NAME}"
