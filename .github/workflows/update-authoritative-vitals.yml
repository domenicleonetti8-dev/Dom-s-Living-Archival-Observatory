name: Update authoritative Earth vitals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/update_authoritative_vitals.py'
      - 'tools/update_2026_current_sources.py'
      - 'tools/update_coral_network.py'
      - 'tools/update_weather_climate_networks.py'
      - '.github/workflows/update-authoritative-vitals.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: authoritative-vitals-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authoritative vitals, coral, weather and climate networks
        run: |
          python tools/update_authoritative_vitals.py
          python tools/update_2026_current_sources.py
          python tools/update_coral_network.py
          python tools/update_weather_climate_networks.py
      - name: Validate authoritative snapshots and station fabric
        run: |
          python - <<'PY'
          import json, math, pathlib, re
          from datetime import datetime, timezone
          p=json.load(open('data/live-vitals.json'))
          assert p['schema']=='dom-authoritative-vitals-2026-v2'
          assert p.get('verifiedAsOf')==datetime.now(timezone.utc).date().isoformat()
          for key in ('population','temperature','seaLevel','cryosphere','coralBleaching','seaLevelCurrent'):
              assert p[key]['status'] in ('live','failed')
          for key in ('population','temperature','seaLevel','seaLevelCurrent'):
              assert p[key].get('sourceUrl','').startswith('https://')
          if p['temperature']['status']=='live':
              assert p['temperature']['baseline']=='1951-1980'; assert -5 <= float(p['temperature']['anomalyC']) <= 5
          if p['seaLevel']['status']=='live':
              s=p['seaLevel']; assert 0 <= float(s['trendMmPerYear']) <= 20; assert int(s['sampleCount']) >= 24
              assert float(s['endDecimalYear']) >= float(s['startDecimalYear']); assert -1 <= float(s['r2']) <= 1
              assert 'autocorrelated' in s.get('statisticalCaveat','')
          sc=p['seaLevelCurrent']
          if sc['status']=='live':
              assert 0 <= float(sc['measurementMm']) <= 1000
              if sc.get('uncertaintyMm') is not None: assert 0 <= float(sc['uncertaintyMm']) <= 100
              assert str(sc.get('observationPeriod','')).startswith('2026-'); assert sc.get('current') is True
          c=p['cryosphere']
          if c['status']=='live':
              assert any(x.get('status')=='live' for x in c['seaIce'].values())
              for x in c['seaIce'].values():
                  assert x.get('sourceUrl','').startswith('https://')
                  if x.get('status')!='live': continue
                  assert 0 < float(x['extentMillionKm2']) <= 30
                  n=int(x.get('climatologySampleCount') or 0)
                  if n >= 20:
                      mean=float(x['climatologyMeanMillionKm2']); anom=float(x['anomalyMillionKm2']); pct=float(x['anomalyPercent'])
                      assert mean > 0; assert math.isclose(pct, anom/mean*100, rel_tol=1e-10, abs_tol=1e-10); assert x.get('climatologyPeriod')=='1981-2010'
          cb=p['coralBleaching']; assert cb.get('sourceUrl','').startswith('https://')
          if cb['status']=='live':
              assert cb.get('productVersion')=='3.1'; assert cb.get('productReleased')=='2026-04-30'
              assert 0 <= float(cb['globalReefPixelsExposedPct']) <= 100; assert int(cb['windowDays']) == 365; assert cb.get('observationDate')
          latest=p.get('latestAssessments') or {}; assert latest.get('forests',{}).get('latestAvailableAsOf2026') is True; assert latest.get('coralCover',{}).get('latestAvailableAsOf2026') is True
          coral=json.load(open('data/coral-live.json'))
          assert coral['schema']=='dom-coral-live-v1'; assert int(coral['stationCount']) >= 150; assert len(coral['stations'])==int(coral['stationCount'])
          for s in coral['stations']:
              assert -90 <= float(s['lat']) <= 90 and -180 <= float(s['lon']) <= 180; assert s.get('sourceUrl','').startswith('https://')
          wc=json.load(open('data/weather-climate/manifest.json'))
          assert wc['schema']=='dom-weather-climate-manifest-v2'; assert int(wc['currentYear'])==datetime.now(timezone.utc).year
          assert int(wc['stationCount'])>10000; assert int(wc['tileCount'])>100
          lv=wc.get('locationValidation') or {}; assert lv.get('rangeValidated') is True; assert int(lv.get('crossNetworkSupportRadiusM'))==500
          total=0; supported=0
          tile_re=re.compile(r'^lat_([+-]\d+)_lon_([+-]\d+)$')
          for t in wc['tiles']:
              m=tile_re.match(t['id']); assert m
              south,west=int(m.group(1)),int(m.group(2)); north=south+10; east=west+10
              f=pathlib.Path(t['path'].replace('./','')); assert f.exists()
              q=json.load(open(f)); assert q['schema']=='dom-weather-climate-tile-v2'; assert int(q['stationCount'])==len(q['stations']); total+=len(q['stations'])
              for s in q['stations']:
                  lat=float(s['lat']); lon=float(s['lon'])
                  assert -90 <= lat <= 90 and -180 <= lon <= 180
                  assert south <= lat <= north and west <= lon <= east
                  assert str(s.get('sourceUrl','')).startswith('https://'); assert s.get('coordinateValidated') is True
                  r=s.get('coordinatePrecisionRadiusM')
                  if r is not None: assert 0 <= float(r) <= 100000
                  assert str(s.get('coordinatePrecisionClass','')).startswith(('documented-coordinate','source-coordinate'))
                  if s.get('crossNetworkLocationSupport'):
                      supported+=1; assert 0 <= float(s['crossNetworkNearestM']) <= 500
          assert total==int(wc['stationCount']); assert supported==int(lv.get('crossNetworkSupportedStations',supported))
          print('AUTHORITATIVE_EARTH_CORAL_WEATHER_CLIMATE_2026=PASS')
          PY
      - name: Commit changed snapshots only
        shell: bash
        run: |
          if git diff --quiet -- data/live-vitals.json data/coral-live.json data/weather-climate; then
            echo 'No authoritative snapshot change.'
            exit 0
          fi
          git config user.name 'dom-vitals-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live-vitals.json data/coral-live.json data/weather-climate
          git commit -m 'Refresh authoritative Earth sensor snapshots'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
