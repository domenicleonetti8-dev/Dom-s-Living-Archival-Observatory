name: Update authoritative Earth vitals

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: authoritative-vitals-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authoritative vitals
        run: python tools/update_authoritative_vitals.py
      - name: Validate authoritative snapshot
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/live-vitals.json'))
          assert p['schema']=='doms-authoritative-vitals-v1'
          for key in ('population','temperature','seaLevel','cryosphere'):
              row=p[key]
              assert row['status'] in ('live','failed')
          for key in ('population','temperature','seaLevel'):
              assert p[key].get('sourceUrl','').startswith('https://')
          c=p['cryosphere']
          if c['status']=='live':
              assert any(x.get('status')=='live' for x in c['seaIce'].values())
              for x in c['seaIce'].values():
                  assert x.get('sourceUrl','').startswith('https://')
          print('AUTHORITATIVE_VITALS_SNAPSHOT=PASS')
          PY
      - name: Commit changed snapshot only
        shell: bash
        run: |
          if git diff --quiet -- data/live-vitals.json; then
            echo 'No vitals snapshot change.'
            exit 0
          fi
          git config user.name 'doms-vitals-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live-vitals.json
          git commit -m 'Refresh authoritative Earth vitals snapshot'
          git push origin "HEAD:${GITHUB_REF_NAME}"
