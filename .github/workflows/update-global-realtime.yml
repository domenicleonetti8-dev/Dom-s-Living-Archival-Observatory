name: Update global realtime observation snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    paths:
      - 'scripts/update_global_realtime.py'
      - 'scripts/update_seismic_heartbeat.py'
      - 'scripts/update_gdacs_global.py'
      - '.github/workflows/update-global-realtime.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update worldwide public observation snapshots
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/update_global_realtime.py
      - name: Update recent seismic sensor heartbeat
        run: python scripts/update_seismic_heartbeat.py
      - name: Update worldwide GDACS disaster snapshot
        run: python scripts/update_gdacs_global.py
      - name: Commit changed snapshots
        run: |
          git config user.name 'dom-observatory-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/global-realtime || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update global realtime observation snapshots'
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            if git push; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
