name: D.O.M. isolated organism qualification

on:
  push:
    branches:
      - global-hazard-observatory-isolated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax qualification
        run: find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Broker compile qualification
        run: python -m py_compile broker/dom_observation_broker.py broker/dom_adapters.py broker/test_dom_observation_broker.py broker/test_static_graph.py
      - name: Canonical path and broker regression suites
        working-directory: broker
        run: python -m unittest -v test_dom_observation_broker.py test_static_graph.py
